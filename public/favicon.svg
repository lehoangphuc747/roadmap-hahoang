<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Đường lộ trình (path) uốn cong từ trái lên phải -->
  <path
    class="road"
    d="M24 96 Q48 48 72 32 L88 24 L104 20"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Điểm đích: vòng tròn -->
  <circle class="dot" cx="104" cy="20" r="10" />
  <!-- Điểm xuất phát -->
  <circle class="dot" cx="24" cy="96" r="6" />
  <style>
    .road, .dot { fill: #0f172a; stroke: #0f172a; }
    .road { fill: none; }
    @media (prefers-color-scheme: dark) {
      .road, .dot { fill: #f1f5f9; stroke: #f1f5f9; }
    }
  </style>
</svg>
